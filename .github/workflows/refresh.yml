name: Refresh player stats

# Vercel's Hobby plan only allows daily Cron Jobs, which isn't frequent
# enough to attribute LP to the right match (see src/lib/kv.ts) or to fully
# backfill a TFT set's match history. GitHub Actions has no such limit, so
# it pings the app's own cron endpoint instead.
#
# 10 minutes rather than 30: trackLpPerMatch can only attribute LP when
# exactly one new ranked game appears between checks, and a LoL game takes
# at least ~15-20 minutes — at a 30-minute cadence, anyone queuing more than
# one game in a sitting routinely had two+ games finish in the same window,
# which isn't just ambiguous, it's unrecoverable (the pointer still jumps to
# the newest game regardless, so the skipped ones never get a value). 10
# minutes comfortably outruns that for anyone but back-to-back dodge/remake
# sessions.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [lol, tft]
    steps:
      # Each roster gets its own request (and its own 60s Vercel function
      # timeout) instead of sharing one — as the tracked roster grew, doing
      # both in a single call started occasionally missing the Hobby-plan
      # 60s cap.
      - name: Call refresh endpoint (${{ matrix.game }})
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://soloqtracker.vercel.app/api/cron/refresh?game=${{ matrix.game }}")
          cat response.json
          if [ "$status" -ge 300 ]; then
            echo "Refresh endpoint returned HTTP $status"
            exit 1
          fi
